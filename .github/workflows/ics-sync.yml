name: ICS Sync
run-name: ICS Sync ${{ inputs.request_id || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Kennung des Deployment Managers
        required: false
        type: string
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
concurrency:
  group: vereinskalender-ics-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax prüfen
        run: python -m py_compile sync.py
      - name: Quellen und ICS-Ausgaben aktualisieren
        id: sync
        continue-on-error: true
        run: python sync.py
      - name: Gültige Ergebnisse und Status speichern
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        run: |
          if [ ! -d generated ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- generated
          if ! git diff --cached --quiet; then
            git commit -m "Automatische ICS-Synchronisation"
            git push
          fi
      - name: Ergebnis mit konkreter Ursache zusammenfassen
        if: ${{ always() }}
        run: python sync.py --summary
      - name: Teilfehler mit Ursache melden
        if: ${{ always() && steps.sync.outcome == 'failure' }}
        run: python sync.py --failure-details
